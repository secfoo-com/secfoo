[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secfoo"
dynamic = ["version"]
description = "AI security review CLI: SAST, secret scanning, SCA, threat modeling and architecture review with Claude Code, Copilot, Codex, Gemini, Cursor or an API key. Reads your design docs, Confluence and Jira through MCP. SARIF output for CI."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "RakFort", email = "info@rakfort.com" },
]
keywords = [
  "security", "appsec", "devsecops", "sast", "static-analysis", "secret-scanning", "sca",
  "threat-modeling", "security-architecture", "owasp", "stride", "sarif", "code-review",
  "ai-security", "llm", "llm-agent", "claude-code", "copilot", "codex", "gemini", "cursor",
  "security-scanner", "ci", "compliance", "mcp", "confluence", "context-aware",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # typer>=0.12 alone still resolves/keeps typer 0.12.3 on an environment
  # that already has it (e.g. an old venv, or a resolver picking the
  # floor) -- confirmed by hitting a real one: typer 0.12.3 + click 8.5.0
  # broke multi-word option parsing ("secfoo accept create --threat-id T1
  # ..." rejected as unexpected extra arguments). typer>=0.29.1 is the
  # actual minimum verified working against the click pin below.
  "typer>=0.29.1",
  # click 8.3.3+ fixes PYSEC-2026-2132 (click.edit command injection).
  "click>=8.5.1,<9",
  "rich>=15.0.0",
  "fastapi>=0.162.5",
  "uvicorn[standard]>=0.54.0",
  "jinja2>=3.1.6",
  "markdown-it-py>=4.3.0",
  "python-multipart>=0.0.32",
  "tomli>=2.0; python_version < '3.11'",
  # Pure-Python text extraction for uploaded third-party vendor documents
  # (docext.py) -- deliberately no system-level binaries (no poppler, no
  # LibreOffice) so the Docker/Kubernetes image stays lean and doesn't
  # need extra OS packages installed.
  "pypdf>=7.1.0",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "langgraph>=1.2.21",
  "litellm>=1.109.1",
  "tomlkit>=0.13.0",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.26.0", "pytest>=9.2.0", "pytest-cov>=7.1.0", "hypothesis>=6.168.5", "httpx>=0.28.1", "ruff>=0.17.5", "bandit>=1.9.4", "pip-audit>=2.10.1", "langgraph>=1.2.21"]
build = ["pyinstaller>=6.22.3"]
# The `api` agent (secfoo/agents/api.py) needs litellm and langgraph, which are regular
# dependencies above, so there is no separate `api` extra to install.
# (dev lists langgraph too so the real graph runs in tests; litellm is faked.)

[project.urls]
Homepage = "https://secfoo.com"
Documentation = "https://secfoo.com/docs/index.html"
Source = "https://github.com/secfoo-com/secfoo"
Changelog = "https://github.com/secfoo-com/secfoo/releases"
Issues = "https://github.com/secfoo-com/secfoo/issues"
"CI integration" = "https://github.com/secfoo-com/secfoo/blob/main/docs/CI.md"

[project.scripts]
secfoo = "secfoo.cli:main"

[tool.hatch.version]
# Single source of truth for the version -- pyproject.toml reads it from
# here instead of duplicating it, so a version bump can't happen in one
# place and not the other (exactly the bug that shipped 0.1.1 with
# secfoo.__version__ still reporting "0.1.0").
path = "src/secfoo/__about__.py"

[tool.hatch.build.targets.sdist]
# `only-include` (not `include`, which is additive on top of hatchling's
# default "everything in the project root" selection -- confirmed the hard
# way when `include` alone still let an unrelated cloned repo leak into a
# published release) is the actual strict allowlist: nothing outside these
# paths ships, full stop, regardless of what else lands in the project root.
only-include = [
  "src/secfoo",
  "README.md",
  "LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/secfoo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
