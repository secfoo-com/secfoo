# Keeps the pinned GitHub Actions SHAs, the Docker base image digest, and
# the Python / npm dependencies current. Grouped so a week's worth of
# bumps arrives as one PR per ecosystem instead of a dozen.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: npm
    directory: /npm
    schedule:
      interval: weekly
      day: monday
    groups:
      npm:
        patterns: ["*"]
