name: CI

# Runs on every push and PR so a broken build never reaches main.
# This is the test/lint gate release.yml assumes already passed.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Linux jobs keep the exact names branch protection requires
    # ("Test (py3.10)", "Test (py3.12)"); the others add their OS.
    name: Test (py${{ matrix.python-version }}${{ matrix.os != 'ubuntu-latest' && format(', {0}', matrix.os) || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both Python versions on Linux; one on macOS and Windows, which
        # secfoo also ships binaries for (#113).
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.12" }
          # macos-14 runners are retired ("configuration not supported").
          - { os: macos-15, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    defaults:
      run:
        # One shell everywhere: the summary step uses bash redirection.
        shell: bash
    env:
      # Box-drawing characters in CLI output must not crash a cp1252 console.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Vendor mermaid.min.js
        # A handful of dashboard tests assert diagrams actually render,
        # which only happens once this ~3.5MB bundle is fetched (see
        # `secfoo vendor mermaid` in cli.py). It lives under ~/.secfoo, not
        # the repo, so a clean checkout -- this CI runner included --
        # doesn't have it until this step fetches it.
        run: secfoo vendor mermaid

      - name: Lint (ruff)
        # Non-blocking for now: 102 pre-existing findings (mostly Optional[X]
        # vs X | None style, plus a few unused test fixtures) predate this
        # workflow. Reporting them here for visibility without turning every
        # unrelated PR red; flip to a hard failure once that backlog is
        # cleared (tracked separately from this CI/CD setup).
        run: ruff check . || true

      - name: Test (secfoo core)
        # Coverage is collected here and gated in its own last step, so a
        # coverage-only drop never hides the conformance and skills checks.
        run: pytest tests --cov=secfoo --cov-report=term --cov-report=xml

      - name: Coverage summary
        # The per-file table, lowest first, so a drop is visible on the PR.
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Coverage (${{ matrix.os }}, py${{ matrix.python-version }})"
            echo
            echo '```'
            coverage report --sort=cover --skip-covered || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage.xml
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

      - name: Runtime probe conformance (reference Python probe, #73)
        run: secfoo sensor conformance -- python -m secfoo.sensor -m secfoo.runtime.conformance.sample_app

      - name: Validate example custom skills
        # Same check a team's own skills repo would run (docs/SKILLS.md).
        run: secfoo skills validate examples/skills

      - name: Coverage floor (#115)
        # The job fails if total line coverage drops below the floor. Set just
        # under today's ~92%; raise it when a PR lifts coverage, never lower
        # it to make a PR pass.
        if: ${{ !cancelled() }}
        run: coverage report --fail-under=90

  docs:
    name: Docs (links, version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: __about__.py is at or above the latest PyPI release
        run: python scripts/check_pypi_version.py

      - name: Check links in README.md and docs/
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        env:
          # Authenticated github.com requests avoid the anonymous rate limit.
          # 502/503 are accepted too: github.com throttles blob pages crawled
          # from Actions runners with 503, while a broken link is a 404.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --no-progress --max-retries 2 --accept 200,201,204,429,502,503 --exclude '^https?://(localhost|127\.0\.0\.1)' --exclude 'ghcr\.io' --exclude 'npmjs\.com' --exclude 'raw\.githubusercontent\.com/.*/leaderboard' README.md 'docs/**/*.md'
          fail: true
