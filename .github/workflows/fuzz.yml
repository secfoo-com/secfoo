name: Fuzz

# Coverage-guided fuzzing (#121) of the parsers that turn untrusted input --
# agent output, skill files, config.toml, uploaded documents, runtime
# sensor batches -- into exit codes and dashboard content. Each harness
# runs for 60 seconds from its seed corpus in fuzz/corpus/<harness>/ and
# fails the job on a crash, uploading the reproducer.
#
# Reproduce a crash on any platform, without Atheris:
#   python fuzz/fuzz_<harness>.py crash-<sha1>
# then add the file to fuzz/corpus/<harness>/ with the fix, so
# tests/test_property_fuzz_targets.py replays it on every run.

on:
  pull_request:
    paths:
      - "src/secfoo/report/**"
      - "src/secfoo/skills/**"
      - "src/secfoo/settings.py"
      - "src/secfoo/docext.py"
      - "src/secfoo/runtime/**"
      - "src/secfoo/web/finding_filters.py"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  schedule:
    - cron: "17 3 * * *"  # nightly, so slow-to-find crashes surface between PRs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.harness }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        harness: [parsers, sarif_export, skill_loader, config, docext, runtime_ingest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package + Atheris
        run: pip install -e ".[dev]" "atheris==3.1.0"

      - name: Fuzz for 60 seconds
        # New inputs libFuzzer finds go to work/ (the first folder), never
        # into the committed seed corpus. -timeout catches hangs (a
        # pathological PDF), -rss_limit_mb decompression bombs.
        run: |
          mkdir -p work artifacts
          python fuzz/fuzz_${{ matrix.harness }}.py work fuzz/corpus/${{ matrix.harness }} \
            -max_total_time=60 -timeout=30 -rss_limit_mb=2560 -artifact_prefix=artifacts/ -print_final_stats=1

      - name: Upload the crash reproducer
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crash-${{ matrix.harness }}
          path: artifacts/
          if-no-files-found: ignore
