name: Leaderboard

# Scores merged PRs by the difficulty of the issues they close and publishes
# the result to the `leaderboard` branch (LEADERBOARD.md, leaderboard.json,
# badge.json). Rules live in scripts/leaderboard.py and CONTRIBUTING.md.
#
# main is branch-protected, so the generated files go to their own branch
# instead: https://github.com/secfoo-com/secfoo/blob/leaderboard/LEADERBOARD.md

on:
  pull_request_target:
    # pull_request_target (not pull_request) so PRs from forks -- which is
    # most hackathon PRs -- get a token that can comment and push. Safe
    # because this workflow never checks out or runs the PR's code; it only
    # reads merge metadata through the API.
    types: [closed]
    branches: [main]
  issues:
    # Re-score when a maintainer adds a difficulty label after the fact.
    types: [labeled, unlabeled]
  schedule:
    # Every 6 hours, as a catch-all.
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions: read-all

# One publish at a time so two merges in quick succession don't race on the
# leaderboard branch.
concurrency:
  group: leaderboard
  cancel-in-progress: false

jobs:
  publish:
    name: Score and publish
    if: >-
      (github.event_name != 'pull_request_target' && github.event_name != 'issues')
      || (github.event_name == 'pull_request_target' && github.event.pull_request.merged == true)
      || (github.event_name == 'issues' && startsWith(github.event.label.name, 'difficulty'))
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push to the leaderboard branch
      pull-requests: write   # comment the award on the merged PR
    env:
      # Optional tuning. LEADERBOARD_SINCE counts only PRs merged at/after an
      # ISO-8601 instant (e.g. "2026-11-08T00:00:00Z" for hackathon-only);
      # LEADERBOARD_EXCLUDE is a comma-separated list of logins to leave off
      # (e.g. maintainers).
      LEADERBOARD_SINCE: ""
      LEADERBOARD_EXCLUDE: ""

    steps:
      - name: Checkout default branch
        # No `ref:` on purpose -- for pull_request_target this is the base
        # branch, never the PR head. Credentials stay so the push step works.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build leaderboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED_PR: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || '' }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --out build/leaderboard)
          [ -n "$LEADERBOARD_SINCE" ]   && args+=(--since "$LEADERBOARD_SINCE")
          [ -n "$LEADERBOARD_EXCLUDE" ] && args+=(--exclude "$LEADERBOARD_EXCLUDE")
          [ -n "$MERGED_PR" ]           && args+=(--announce-pr "$MERGED_PR")
          python3 scripts/leaderboard.py "${args[@]}"

      - name: Publish to the leaderboard branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin leaderboard >/dev/null; then
            git fetch --depth=1 origin leaderboard
            git checkout -B leaderboard origin/leaderboard
          else
            # First run: start the branch empty so it carries only the
            # generated files, not a copy of main.
            git checkout --orphan leaderboard
            git rm -rfq --cached .
            git clean -fdxq -e build
            printf '# secfoo leaderboard branch\n\nGenerated by the Leaderboard workflow on main. See LEADERBOARD.md.\n' > README.md
            git add README.md
          fi
          cp build/leaderboard/LEADERBOARD.md build/leaderboard/leaderboard.json build/leaderboard/badge.json .
          git add LEADERBOARD.md leaderboard.json badge.json
          if git diff --cached --quiet; then
            echo "Leaderboard unchanged; nothing to publish."
            exit 0
          fi
          git commit -q -m "leaderboard: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin leaderboard
