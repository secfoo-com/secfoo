name: Self Test

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run secfoo with fake agent
        uses: ./
        with:
          agent: fake
          target: tests/fixtures/ci/
        env:
          SECFOO_FAKE_AGENT: "1"