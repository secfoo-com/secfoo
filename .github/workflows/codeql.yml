name: CodeQL

# Static analysis on every push to main and every PR, plus a weekly sweep
# for newly published queries. Replaces GitHub's "default setup", which
# only scanned PRs and left direct pushes uncovered.
#
# Results land in Security > Code scanning. A default-setup and an
# advanced workflow can't both be enabled, so default setup is turned off
# for this repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 * * 2"

permissions: read-all

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          # tests/fixtures holds deliberately vulnerable code (the adversarial
          # evaluation corpus needs a real bug for the agent to find), so its
          # findings are expected and must not land in the Security tab.
          config: |
            paths-ignore:
              - tests/fixtures/**

      - name: Analyze
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
